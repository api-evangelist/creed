aid: creed
name: Creed
description: >-
  Creed (Creed Labs, operated by Lemon Tree Labs Inc.) is a Brooklyn-based faith-tech company building
  an AI-powered Bible study, prayer, and Christian community app used by more than two million people.
  The consumer product pairs a voice-enabled AI companion (Lenny) with daily prayers, devotionals,
  scripture retrieval, a moderated prayer wall, learning plans, gratitude and prayer journaling,
  friend streaks, church discovery, leaderboards, and gamification. Creed also ships tools for churches
  and creators to grow and engage their congregations. Its public backend is a FastAPI service at
  api.usecreed.com exposing 191 operations across chatbot, prayer, church-admin, social, and
  gamification domains, secured with Supabase-issued JWT bearer tokens.
