openapi: 3.2.0
info:
  title: Creed Referrals API
  description: Creed API - Christian AI Chatbot
  version: 1.0.0
tags:
- name: Referrals
paths:
  /api/referrals/code:
    get:
      tags:
      - Referrals
      summary: Get Or Create Referral Code
      description: 'Get the authenticated user''s referral code, creating one if it doesn''t exist.

        If the user has an active code, it will be returned.

        If not, a new code will be created and returned.


        Returns:

        ReferralCodeResponse with code details'
      operationId: get_or_create_referral_code_api_referrals_code_get
      security:
      - HTTPBearer: []
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/referrals/redeem:
    post:
      tags:
      - Referrals
      summary: Redeem Referral Code
      description: 'Redeem a referral code to get premium access.


        Restrictions:

        - Users cannot redeem their own codes

        - Users can only redeem one code (cannot redeem if already redeemed)

        - Code must be active and not expired


        Args:

        request: RedeemCodeRequest with the token (the actual code)


        Returns:

        RedeemCodeResponse with success status and access expiry'
      operationId: redeem_referral_code_api_referrals_redeem_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemCodeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemCodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/referrals/claim-reward:
    post:
      tags:
      - Referrals
      summary: Claim Referrer Reward
      description: 'Claim the referrer reward for a specific redemption.


        This endpoint allows referrers to claim their 1 month premium reward

        when someone uses their referral code. The reward is stacked on top

        of any existing subscription.


        Args:

        request: ClaimRewardRequest with the redemption_id


        Returns:

        ClaimRewardResponse with success status and message'
      operationId: claim_referrer_reward_api_referrals_claim_reward_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRewardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimRewardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/referrals/redemptions:
    get:
      tags:
      - Referrals
      summary: Get User Redemptions
      description: 'Get all redemptions for the authenticated user''s referral code.


        This endpoint returns a list of all users who have redeemed the current user''s

        referral code, including the claim status of each redemption.


        Returns:

        RedemptionsResponse with list of redemptions and counts'
      operationId: get_user_redemptions_api_referrals_redemptions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/referrals/redeem-promo:
    post:
      tags:
      - Referrals
      summary: Redeem Promo Code
      description: 'Redeem a system-generated referral code.


        Validates the code against the referral_codes table (case-insensitive), then grants

        RevenueCat premium for the duration configured on the code (week / month / year),

        stacking on top of any existing subscription. The grant is recorded in referral_grants.


        Restrictions:

        - Code must exist in referral_codes and have status = ''active''

        - User cannot redeem the same code more than once (no limit on redeeming different codes)


        Args:

        request: RedeemSystemCodeRequest with the code


        Returns:

        RedeemSystemCodeResponse with success status and message'
      operationId: redeem_promo_code_api_referrals_redeem_promo_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemPromoCodeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemPromoCodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    RedeemCodeRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
          description: The referral code to redeem
      type: object
      required:
      - token
      title: RedeemCodeRequest
      description: Request model for redeeming a referral code
    RedeemCodeResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether the redemption was successful
        message:
          type: string
          title: Message
          description: Success or error message
      type: object
      required:
      - success
      - message
      title: RedeemCodeResponse
      description: Response model for redeeming a referral code
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ClaimRewardResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether the claim was successful
        message:
          type: string
          title: Message
          description: Success or error message
      type: object
      required:
      - success
      - message
      title: ClaimRewardResponse
      description: Response model for claiming referrer reward
    ClaimRewardRequest:
      properties:
        redemption_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Redemption Id
          description: The ID of the redemption record
      type: object
      required:
      - redemption_id
      title: ClaimRewardRequest
      description: Request model for claiming referrer reward
    RedeemPromoCodeRequest:
      properties:
        code:
          type: string
          minLength: 1
          title: Code
          description: The promo code to redeem
      type: object
      required:
      - code
      title: RedeemPromoCodeRequest
      description: Request model for redeeming a promo code
    ReferralCodeResponse:
      properties:
        success:
          type: boolean
          title: Success
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        redemptions:
          type: integer
          title: Redemptions
      type: object
      required:
      - success
      - code
      - message
      - redemptions
      title: ReferralCodeResponse
      description: Response model for creating a referral code
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RedeemPromoCodeResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether the redemption was successful
        message:
          type: string
          title: Message
          description: Success or error message
      type: object
      required:
      - success
      - message
      title: RedeemPromoCodeResponse
      description: Response model for redeeming a promo code
    RedemptionRecord:
      properties:
        id:
          type: integer
          title: Id
        code:
          type: string
          title: Code
        referrer_id:
          type: string
          title: Referrer Id
        referee_id:
          type: string
          title: Referee Id
        redeemed_at:
          type: string
          title: Redeemed At
        referrer_reward_claimed:
          type: boolean
          title: Referrer Reward Claimed
        referee_reward_claimed:
          type: boolean
          title: Referee Reward Claimed
      type: object
      required:
      - id
      - code
      - referrer_id
      - referee_id
      - redeemed_at
      - referrer_reward_claimed
      - referee_reward_claimed
      title: RedemptionRecord
      description: Model for a single redemption record
    RedemptionsResponse:
      properties:
        success:
          type: boolean
          title: Success
        redemptions:
          items:
            $ref: '#/components/schemas/RedemptionRecord'
          type: array
          title: Redemptions
        total_count:
          type: integer
          title: Total Count
        unclaimed_count:
          type: integer
          title: Unclaimed Count
      type: object
      required:
      - success
      - redemptions
      - total_count
      - unclaimed_count
      title: RedemptionsResponse
      description: Response model for getting user's redemptions
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token
