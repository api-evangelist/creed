                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DailyQuestResponse:
      properties:
        daily_prayer_completed:
          type: boolean
          title: Daily Prayer Completed
        daily_gratitude_completed:
          type: boolean
          title: Daily Gratitude Completed
        daily_verse_interacted:
          type: boolean
          title: Daily Verse Interacted
        daily_devotional_completed:
          type: boolean
          title: Daily Devotional Completed
        daily_prayer_wall_completed:
          type: boolean
          title: Daily Prayer Wall Completed
        daily_prompt_completed:
          type: boolean
          title: Daily Prompt Completed
        discord_joined:
          type: boolean
          title: Discord Joined
        scene_generator_completed:
          type: boolean
          title: Scene Generator Completed
        widget_tutorial_completed:
          type: boolean
          title: Widget Tutorial Completed
        prayer_reminder_completed:
          type: boolean
          title: Prayer Reminder Completed
        share_creed_completed:
          type: boolean
          title: Share Creed Completed
        customize_completed:
          type: boolean
          title: Customize Completed
        sponsor_completed:
          type: boolean
          title: Sponsor Completed
        add_church_completed:
          type: boolean
          title: Add Church Completed
          default: false
        start_friend_streak_completed:
          type: boolean
          title: Start Friend Streak Completed
          default: false
        faith_lock_completed:
          type: boolean
          title: Faith Lock Completed
          default: false
        artist_of_the_week_completed:
          type: boolean
          title: Artist Of The Week Completed
          default: false
        commit_to_mass_completed:
          type: boolean
          title: Commit To Mass Completed
          default: false
        learning_plan_started_completed:
          type: boolean
          title: Learning Plan Started Completed
          default: false
        learning_plan_completed:
          type: boolean
          title: Learning Plan Completed
          default: false
        total_quests_completed:
          type: integer
          title: Total Quests Completed
          default: 0
        claimed:
          additionalProperties:
            type: boolean
          type: object
          title: Claimed
      type: object
      required:
      - daily_prayer_completed
      - daily_gratitude_completed
      - daily_verse_interacted
      - daily_devotional_completed
      - daily_prayer_wall_completed
      - daily_prompt_completed
      - discord_joined
      - scene_generator_completed
      - widget_tutorial_completed
      - prayer_reminder_completed
      - share_creed_completed
      - customize_completed
      - sponsor_completed
      title: DailyQuestResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token
