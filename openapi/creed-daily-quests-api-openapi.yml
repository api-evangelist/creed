  /api/daily-quests/prompts:
    get:
      tags:
      - daily-quests
      summary: Get Daily Prompts
      description: Return 3 prompts for today. Selection is stable per user per day.
      operationId: get_daily_prompts_api_daily_quests_prompts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional locale override (en, es, pt). When set, prompts are returned in this language without requiring an updated profile. Falls back to preferred_language when omitted or invalid.
          title: Lang
        description: Optional locale override (en, es, pt). When set, prompts are returned in this language without requiring an updated profile. Falls back to preferred_language when omitted or invalid.
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
