  /api/daily-quests/{quest_key}/claim:
    post:
      tags:
      - daily-quests
      summary: Claim Quest Reward
      description: 'Mark a completed quest''s reward as claimed for the authenticated user.

        The actual token grant is performed by the client (preserving the existing

        earnReward animation + analytics flow); this endpoint only records that

        the reward has been claimed for the current period.'
      operationId: claim_quest_reward_api_daily_quests__quest_key__claim_post
      security:
      - HTTPBearer: []
      parameters:
      - name: quest_key
        in: path
        required: true
        schema:
          type: string
          title: Quest Key
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
