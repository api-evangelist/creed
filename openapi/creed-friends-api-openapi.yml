  /api/friends/streaks/send-reminders-cron:
    post:
      tags:
      - friends
      summary: Send Friend Streak Reminders Cron
      description: 'Cron endpoint to send friend streak loss reminders via Expo push.


        POST /api/friends/streaks/send-reminders-cron


        For each active streak pair (streak_count >= 2) at risk of expiring,

        notifies the partner who has completed today to nudge their friend.

        When neither has completed, user_a (canonical first partner) is notified.

        Users with multiple at-risk pairs receive one grouped notification.


        Runs at 10 PM–11:45 PM local time (cron every 30 minutes).

        Requires x-api-key header for authentication.'
      operationId: send_friend_streak_reminders_cron_api_friends_streaks_send_reminders_cron_post
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    NudgeFriendRequest:
      properties:
        text:
          type: string
          maxLength: 2000
          minLength: 1
          title: Text
        is_custom:
          type: boolean
          title: Is Custom
          default: false
      type: object
      required:
      - text
      title: NudgeFriendRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token
