        required: true
        schema:
          type: string
          title: Request Id
      - name: enable_grants
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Enable Grants
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Accept Friend Request Api Friends Request Accept  Request Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/friends/request/reject/{request_id}:
    post:
      tags:
      - friends
      summary: Reject Friend Request
      description: "Reject a friend request by ID.\n\nArgs:\n    request_id: ID of the friend request\n    current_user: Current authenticated user from dependency\n\nReturns:\n    Dict with success status"
