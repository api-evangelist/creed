openapi: 3.2.0
info:
  title: Creed Spotlight API
  description: Creed API - Christian AI Chatbot
  version: 1.0.0
tags:
- name: Spotlight
paths:
  /api/spotlight/seen:
    get:
      tags:
      - Spotlight
      summary: Get Seen
      operationId: get_seen_api_spotlight_seen_get
      security:
      - HTTPBearer: []
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeenEntry'
                title: Response Get Seen Api Spotlight Seen Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Spotlight
      summary: Mark Seen
      operationId: mark_seen_api_spotlight_seen_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSeenRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SeenEntry:
      properties:
        spotlight_id:
          type: string
          title: Spotlight Id
        seen_at:
          type: string
          title: Seen At
      type: object
      required:
      - spotlight_id
      - seen_at
      title: SeenEntry
    MarkSeenRequest:
      properties:
        spotlightId:
          type: string
          title: Spotlightid
      type: object
      required:
      - spotlightId
      title: MarkSeenRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token
